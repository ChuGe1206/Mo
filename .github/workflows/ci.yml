name: phase-0

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt clippy
      - name: Format
        run: cargo +1.97.1 fmt --all -- --check
      - name: Lint
        run: cargo +1.97.1 clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo +1.97.1 test --workspace
      - name: Test isolated Actor probe argument guards
        run: cargo +1.97.1 test -p mo-rime --example actor_latency_probe
      - name: Lint and test opt-in metadata diagnostics
        shell: pwsh
        run: |
          cargo +1.97.1 clippy --workspace --all-targets --features mo-broker/latency-trace -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Trace lint failed' }
          cargo +1.97.1 test --workspace --features mo-broker/latency-trace
      - name: Lint installed-mode build
        run: cargo +1.97.1 clippy --release --workspace --all-targets -- -D warnings
      - name: Verify trace feature is compiled out in installed mode
        run: cargo +1.97.1 clippy --release --workspace --all-targets --features mo-broker/latency-trace -- -D warnings
      - name: Verify release Broker rejects diagnostic startup
        shell: pwsh
        run: ./tools/broker-startup-smoke.ps1 -RustToolchain 1.97.1

  windows-tip:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Compile x64/x86 TIPs and cross-check the Rust broker
        shell: pwsh
        run: ./tools/tip-broker-smoke.ps1 -Architecture All -RustToolchain 1.97.1
      - name: Test isolated registrar registry ownership and cleanup
        shell: pwsh
        run: ./native/windows-tip/test-registrar.ps1
      - name: Test current-user finalizer fail-closed preconditions
        shell: pwsh
        run: ./native/windows-tip/test-user-finalizer-preflight.ps1
      - name: Test registered-smoke rollback policy without changing Windows input state
        shell: pwsh
        run: ./tools/test-registered-tip-state.ps1
      - name: Test development staging policy without installing or registering an IME
        shell: pwsh
        run: |
          ./installer/windows/test-staging.ps1
          ./installer/windows/test-package-authoring.ps1
      - name: Verify same and changed payload upgrade-pair policies
        shell: pwsh
        run: ./installer/windows/test-linked-upgrade-pair.ps1
      - name: Test changed payload VM kit and execution guards
        shell: pwsh
        run: ./installer/windows/test-vm-changed-upgrade-policy.ps1

  librime-abi:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Check pinned C and Rust ABI layouts
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'librime'
          git clone --filter=blob:none --no-checkout https://github.com/rime/librime.git $source
          git -C $source checkout --detach 33e78140250125871856cdc5b42ddc6a5fcd3cd4
          ./tools/abi-probe/compare.ps1 -RimeIncludeDir (Join-Path $source 'src') -MsvcArch x64

  real-rime-smoke:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Verify x64/x86 IPC and TIP edit-session commits through pinned rime-ice
        shell: pwsh
        run: |
          $ice = Join-Path $env:RUNNER_TEMP 'rime-ice'
          git clone --filter=blob:none --no-checkout https://github.com/iDvel/rime-ice.git $ice
          git -C $ice checkout --detach 6810e8916d160498620a16fef2135956fecbd485

          $archive = Join-Path $env:RUNNER_TEMP 'rime-windows-x64.7z'
          Invoke-WebRequest -Uri 'https://github.com/rime/librime/releases/download/1.17.0/rime-33e7814-Windows-msvc-x64.7z' -OutFile $archive
          $expected = '7478C7CAA4FF6B37DE86DABA1F7CE4A994A4F5BA24872A820FB2B3A9B01FED15'
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
          if ($actual -ne $expected) { throw "librime asset hash mismatch: $actual" }

          $unpacked = Join-Path $env:RUNNER_TEMP 'librime-dist'
          New-Item -ItemType Directory -Path $unpacked | Out-Null
          7z x $archive "-o$unpacked" -y
          if ($LASTEXITCODE -ne 0) { throw "7z extraction failed: $LASTEXITCODE" }

          $user = Join-Path $env:RUNNER_TEMP 'rime-user'
          New-Item -ItemType Directory -Path $user | Out-Null
          $openccArchive = Join-Path $env:RUNNER_TEMP 'opencc-1.1.9.zip'
          Invoke-WebRequest -Uri 'https://codeload.github.com/BYVoid/OpenCC/zip/refs/tags/ver.1.1.9' -OutFile $openccArchive
          ./tools/opencc-build/build.ps1 -SourceArchivePath $openccArchive
          $compiler = Join-Path $PWD 'build/opencc-dict-tool/bin/mo_opencc_dict.exe'
          $openccPack = Join-Path $PWD 'build/compiled-opencc'
          ./tools/compile-opencc-data.ps1 -SharedDataDir $ice -CompilerPath $compiler -OutputDirectory $openccPack
          ./tools/test-opencc-data.ps1 -OpenccDataDir $openccPack -CompilerPath $compiler
          ./tools/tip-rime-smoke.ps1 -LibrimeDistDir (Join-Path $unpacked 'dist') -SharedDataDir $ice -UserDataDir $user -Architecture All -RustToolchain 1.97.1 -Deploy -OpenccDataDir $openccPack
          ./tools/tip-rime-smoke.ps1 -LibrimeDistDir (Join-Path $unpacked 'dist') -SharedDataDir $ice -UserDataDir $user -Architecture All -RustToolchain 1.97.1 -LatencyTrace -OpenccDataDir $openccPack
      - name: Build and verify the allowlisted input-free preparation runtime
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'mo-runtime-source'
          git clone --filter=blob:none --no-checkout https://github.com/rime/librime.git $source
          if ($LASTEXITCODE -ne 0) { throw 'Runtime core fetch failed' }
          git -C $source checkout --detach 33e78140250125871856cdc5b42ddc6a5fcd3cd4
          if ($LASTEXITCODE -ne 0) { throw 'Runtime core checkout failed' }
          git -C $source submodule update --init --depth 1 deps/leveldb deps/marisa-trie deps/opencc deps/yaml-cpp
          if ($LASTEXITCODE -ne 0) { throw 'Runtime dependencies fetch failed' }
          git clone --filter=blob:none --no-checkout https://github.com/hchunhui/librime-lua.git (Join-Path $source 'plugins/lua')
          if ($LASTEXITCODE -ne 0) { throw 'Runtime Lua fetch failed' }
          git -C (Join-Path $source 'plugins/lua') checkout --detach ec52e48ea18f11af37717a01c337f853215cf70b
          if ($LASTEXITCODE -ne 0) { throw 'Runtime Lua checkout failed' }
          $cmakeArchive = Join-Path $env:RUNNER_TEMP 'cmake-3.31.10.zip'
          $boostArchive = Join-Path $env:RUNNER_TEMP 'boost-1.84.0.zip'
          $luaArchive = Join-Path $env:RUNNER_TEMP 'lua-5.4.9.tar.gz'
          Invoke-WebRequest 'https://github.com/Kitware/CMake/releases/download/v3.31.10/cmake-3.31.10-windows-x86_64.zip' -OutFile $cmakeArchive
          Invoke-WebRequest 'https://archives.boost.io/release/1.84.0/source/boost_1_84_0.zip' -OutFile $boostArchive
          Invoke-WebRequest 'https://www.lua.org/ftp/lua-5.4.9.tar.gz' -OutFile $luaArchive
          $runtime = Join-Path $PWD 'build/mo-prepared-runtime'
          ./tools/runtime-build/build.ps1 -SourceDir $source -CmakeArchivePath $cmakeArchive -BoostArchivePath $boostArchive -LuaArchivePath $luaArchive -PythonPath (Get-Command python).Source -OpenccDataDir (Join-Path $PWD 'build/compiled-opencc') -OutputDirectory $runtime
          ./tools/runtime-build/test-policy.ps1 -SourceDir $source -CmakeArchivePath $cmakeArchive -BoostArchivePath $boostArchive -LuaArchivePath $luaArchive -PythonPath (Get-Command python).Source -OpenccDataDir (Join-Path $PWD 'build/compiled-opencc')
          ./tools/runtime-build/test-userdb-policy.ps1 -RuntimeBuildDirectory $runtime
          ./tools/test-abi3-diagnostic-patches.ps1 -RuntimeBuildDirectory $runtime -IncludePrefetchExperiment -IncludeDeferredTrace
          ./tools/runtime-build/test-resource-file.ps1
          ./tools/runtime-build/test-relocation.ps1 -LibrimeDistDir (Join-Path $runtime 'dist') -SharedDataDir (Join-Path $env:RUNNER_TEMP 'rime-ice') -UserDataDir (Join-Path $env:RUNNER_TEMP 'rime-user') -RustToolchain 1.97.1
          ./tools/runtime-build/test-dictionary-compatibility.ps1 -RuntimeBuildDirectory $runtime -OpenccDataDir (Join-Path $PWD 'build/compiled-opencc')
          ./tools/runtime-build/test-preparation.ps1 -LibrimeDistDir (Join-Path $runtime 'dist') -OfficialDistDir (Join-Path $env:RUNNER_TEMP 'librime-dist/dist') -SharedDataDir (Join-Path $env:RUNNER_TEMP 'rime-ice') -UserDataDir (Join-Path $env:RUNNER_TEMP 'rime-user') -OpenccDataDir (Join-Path $PWD 'build/compiled-opencc') -RustToolchain 1.97.1 -BrokerPath (Join-Path $PWD 'target/debug/mo-broker.exe')
      - name: Verify actual user dictionary errors preserve synthetic records
        shell: pwsh
        run: |
          $runtime = Join-Path $PWD 'build/mo-prepared-runtime'
          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio/Installer/vswhere.exe'
          $msbuild = & $vswhere -latest -products '*' -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild not found' }
          $output = Join-Path $PWD 'build/userdb-fixture-probe'
          & $msbuild native/librime/diagnostics/UserDbFixtureProbe.vcxproj /nologo /m:1 /nodeReuse:false /p:Configuration=Release /p:Platform=x64 "/p:MoLevelDbIncludeDir=$runtime/prefix/include" "/p:MoLevelDbLibrary=$runtime/prefix/lib/leveldb.lib" "/p:MoDiagnosticOutDir=$output"
          if ($LASTEXITCODE -ne 0) { throw 'User DB fixture probe build failed' }
          cargo +1.97.1 build -p mo-rime --example actor_latency_probe
          if ($LASTEXITCODE -ne 0) { throw 'Actor probe build failed' }
          cargo +1.97.1 build -p mo-broker --features latency-trace
          if ($LASTEXITCODE -ne 0) { throw 'Broker build failed' }
          $paths = @{
            RuntimePath = (Join-Path $runtime 'dist/lib/rime.dll')
            ActorPath = (Join-Path $PWD 'target/debug/examples/actor_latency_probe.exe')
            BrokerPath = (Join-Path $PWD 'target/debug/mo-broker.exe')
            FixtureProbePath = (Join-Path $output 'mo_userdb_fixture_probe.exe')
            SharedDataDir = (Join-Path $env:RUNNER_TEMP 'rime-ice')
            CompiledDataDir = (Join-Path $env:RUNNER_TEMP 'rime-user/build')
          }
          ./tools/test-userdb-errors-policy.ps1 @paths
          $hashes = @{
            runtime = (Get-FileHash -LiteralPath $paths.RuntimePath).Hash
            actor = (Get-FileHash -LiteralPath $paths.ActorPath).Hash
            broker = (Get-FileHash -LiteralPath $paths.BrokerPath).Hash
            fixture = (Get-FileHash -LiteralPath $paths.FixtureProbePath).Hash
          }
          ./tools/test-userdb-errors.ps1 @paths -ExpectedHashes $hashes -EvidenceName ci-userdb-errors
      - name: Check isolated scalar page-read diagnostics
        shell: pwsh
        run: |
          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio/Installer/vswhere.exe'
          $msbuild = & $vswhere -latest -products * -find 'MSBuild/**/Bin/MSBuild.exe' | Select-Object -First 1
          $output = Join-Path $PWD 'build/mo-read-page-probe'
          & $msbuild native/librime/diagnostics/ReadPageProbe.vcxproj /nologo /m:1 /nodeReuse:false /p:Configuration=Release /p:Platform=x64 "/p:MoDiagnosticOutDir=$output"
          if ($LASTEXITCODE -ne 0) { throw 'Read-page strict probe build failed' }
          ./tools/test-read-page-probe.ps1 -ProbePath (Join-Path $output 'mo_read_page_probe.exe')
          $deferred = Join-Path $PWD 'build/mo-deferred-probe'
          & $msbuild native/librime/diagnostics/DeferredProbe.vcxproj /nologo /m:1 /nodeReuse:false /p:Configuration=Release /p:Platform=x64 "/p:MoDiagnosticOutDir=$deferred"
          if ($LASTEXITCODE -ne 0) { throw 'Deferred strict probe build failed' }
          ./tools/test-deferred-probe.ps1 -ProbePath (Join-Path $deferred 'mo_deferred_probe.exe')
      - name: Check TIP latency diagnostic refusal policy
        shell: pwsh
        run: ./tools/test-tip-latency-diagnostic.ps1
      - name: Check synthetic LevelDB crash and error recovery boundaries
        shell: pwsh
        run: |
          $runtime = Join-Path $PWD 'build/mo-prepared-runtime'
          $include = Join-Path $PWD 'build/db-recovery-include'
          New-Item -ItemType Directory -Path (Join-Path $include 'rime') | Out-Null
          Copy-Item native/librime/diagnostics/mo_diagnostic.h (Join-Path $include 'rime/mo_diagnostic.h')
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $msbuild = & $vswhere -latest -products '*' -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild not found' }
          $output = Join-Path $PWD 'build/db-recovery-probe'
          & $msbuild native/librime/diagnostics/DbRecoveryProbe.vcxproj /nologo /m:1 /nodeReuse:false /p:Configuration=Release /p:Platform=x64 "/p:MoLevelDbIncludeDir=$runtime/prefix/include" "/p:MoLevelDbLibrary=$runtime/prefix/lib/leveldb.lib" "/p:MoDiagnosticIncludeDir=$include" "/p:MoDiagnosticOutDir=$output"
          if ($LASTEXITCODE -ne 0) { throw 'Recovery probe build failed' }
          $probe = Join-Path $output 'mo_db_recovery_probe.exe'
          ./tools/test-db-recovery-policy.ps1 -ProbePath $probe
          ./tools/test-db-recovery.ps1 -ProbePath $probe -ExpectedProbeSha256 (Get-FileHash -LiteralPath $probe).Hash -EvidenceName ci-db-recovery-matrix
      - name: Build and test non-installable development deployment assets
        shell: pwsh
        run: |
          $stageBuild = Join-Path $PWD 'build/mo-windows-stage'
          ./installer/windows/prepare-stage.ps1 -RuntimeBuildDirectory (Join-Path $PWD 'build/mo-prepared-runtime') -RimeIceSourceDir (Join-Path $env:RUNNER_TEMP 'rime-ice') -OutputDirectory $stageBuild -RustToolchain 1.97.1
          ./installer/windows/verify-stage.ps1 -StageDirectory (Join-Path $stageBuild 'stage')
          ./installer/windows/test-staging.ps1 -StageDirectory (Join-Path $stageBuild 'stage')
          ./installer/windows/test-package-authoring.ps1 -StageDirectory (Join-Path $stageBuild 'stage')
          ./tools/test-candidate-lifecycle-policy.ps1 -StageDirectory (Join-Path $stageBuild 'stage')
          $shared = Join-Path $stageBuild 'stage/payload/Mo/data/rime-ice'
          ./tools/test-learning-option.ps1 -RuntimeBuildDirectory (Join-Path $PWD 'build/mo-prepared-runtime') -SharedDataDirectory $shared -OutputDirectory (Join-Path $PWD 'build/ci-userdb-learning') -RustToolchain 1.97.1
          cargo +1.97.1 build -p mo-rime --example settings_smoke
          if ($LASTEXITCODE -ne 0) { throw 'Settings probe build failed' }
          $settingsUser = Join-Path $PWD 'build/ci-userdb-settings'
          New-Item -ItemType Directory -Path $settingsUser | Out-Null
          & (Join-Path $PWD 'target/debug/examples/settings_smoke.exe') (Join-Path $PWD 'build/mo-prepared-runtime/dist/lib/rime.dll') $shared $settingsUser
          if ($LASTEXITCODE -ne 0) { throw 'User DB settings/schema/Emoji regression failed' }
          ./installer/windows/test-stage-runtime.ps1 -BuildDirectory $stageBuild -FaultRepetitions 10 -RustToolchain 1.97.1
          ./tools/candidate-lifecycle-probe.ps1 -StageDirectory (Join-Path $stageBuild 'stage') -OutputDirectory (Join-Path $PWD 'build/mo-candidate-trace') -Repetitions 10 -LatencyTrace -RustToolchain 1.97.1
      - name: Verify strict prepared TIP latency and input flow
        shell: pwsh
        run: |
          $runtime = Join-Path $PWD 'build/mo-prepared-runtime'
          ./tools/tip-rime-smoke.ps1 -LibrimeDistDir (Join-Path $runtime 'dist') -SharedDataDir (Join-Path $env:RUNNER_TEMP 'rime-ice') -UserDataDir (Join-Path $env:RUNNER_TEMP 'rime-user') -Architecture All -RustToolchain 1.97.1 -PreparedResources -LatencyTrace -OpenccDataDir (Join-Path $PWD 'build/compiled-opencc')
