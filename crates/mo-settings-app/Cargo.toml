[package]
name = "mo-settings-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Native Windows settings frontend for the Mo input method"

[dependencies]
mo-settings = { path = "../mo-settings" }
mo-windows-platform = { path = "../mo-windows-platform" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

[[bin]]
name = "mo-settings"
path = "src/main.rs"
doc = false
